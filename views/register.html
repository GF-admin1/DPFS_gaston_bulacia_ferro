<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexStore | Registro</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header class="header-main">
        <div class="logo">
            <h1>LexStore</h1>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="register.html">Crear Cuenta</a></li>
                <li><a href="login.html">Ingresar</a></li>
                <li><a href="productCart.html">Mi Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="formulario-registro">
            <h2>Crear Cuenta</h2>
            <form action="/" method="GET">
                <div class="campo-formulario">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="campo-formulario">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>
                <div class="campo-formulario">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="campo-formulario">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-enviar">Registrarse</button>
            </form>
        </section>
    </main>

    <footer class="footer-main">
        <p>&copy; 2026 LexStore. Proyecto de desarrollo web.</p>
    </footer>
</body>
</html>
